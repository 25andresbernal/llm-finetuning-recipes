[project]
name = "llm-finetuning-recipes"
version = "0.1.0"
description = "Unsloth QLoRA fine-tuning recipe for a conversational phone agent, with a synthetic dataset, dataset checks, offline eval, and an OpenAI-compatible serving stub."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
# GPU training dependencies. Linux + CUDA only; do not install on a machine
# without an NVIDIA GPU. See docs/cost-and-gpu-notes.md for version-pinning
# notes between unsloth, trl, and xformers before changing these pins.
train = [
    "torch>=2.2",
    "unsloth",
    "bitsandbytes>=0.43",
    "transformers>=4.40,<4.46",
    "trl>=0.9,<0.10",
    "accelerate>=0.30",
    "peft>=0.11",
    "xformers>=0.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_finetuning_recipes"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
